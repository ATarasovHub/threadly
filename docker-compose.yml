services:
  postgres:
    image: postgres:17-alpine
    container_name: threadly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-threadly}
      POSTGRES_USER: ${DB_USER:-threadly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-threadly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-threadly} -d ${DB_NAME:-threadly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
