services:
  postgres:
    image: postgres:17-alpine
    container_name: threadly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-threadly}
      POSTGRES_USER: ${DB_USER:-threadly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-threadly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-threadly} -d ${DB_NAME:-threadly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: threadly-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-threadly}
      DB_USER: ${DB_USER:-threadly}
      DB_PASSWORD: ${DB_PASSWORD:-threadly}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      # Flyway runs at startup, so the database has to be accepting connections first.
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
