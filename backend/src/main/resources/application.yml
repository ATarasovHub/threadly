spring:
  application:
    name: threadly
  datasource:
    # DB_URL wins when set, because a managed provider hands out one connection string with its
    # own host, database and parameters — Neon and friends require sslmode=require, which a URL
    # assembled from separate parts cannot carry. The composed form stays as the local default.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadly}}
    username: ${DB_USER:threadly}
    password: ${DB_PASSWORD:threadly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    # Pin the locale so validation messages are always English. Otherwise Hibernate Validator
    # follows Accept-Language, or the server's default locale when the header is absent, and the
    # same request yields different message text depending on who asks and where it runs.
    locale: en
    locale-resolver: fixed

threadly:
  jwt:
    # Development-only fallback. Production must supply JWT_SECRET; anyone holding this value
    # can mint valid tokens.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    issuer: ${JWT_ISSUER:https://threadly.dev}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  auth:
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
    # Off locally because the dev frontend talks plain HTTP; must be true anywhere else.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-path: /api/v1/auth

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Per client, per period. Writes get the tighter quota.
    capacity: ${RATE_LIMIT_CAPACITY:300}
    write-capacity: ${RATE_LIMIT_WRITE_CAPACITY:60}
    period: ${RATE_LIMIT_PERIOD:1m}

  oauth:
    google:
      # Empty by default: without a client id the Google endpoint stays switched off rather than
      # accepting tokens it cannot check the audience of.
      client-id: ${GOOGLE_CLIENT_ID:}

  cors:
    # The Vite dev server. Production adds its real origin here; wildcards are not an option
    # because the refresh cookie travels with credentials.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints grouped by tag read better than one alphabetical wall.
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
