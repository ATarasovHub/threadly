spring:
  application:
    name: threadly
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadly}
    username: ${DB_USER:threadly}
    password: ${DB_PASSWORD:threadly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

threadly:
  jwt:
    # Development-only fallback. Production must supply JWT_SECRET; anyone holding this value
    # can mint valid tokens.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    issuer: ${JWT_ISSUER:https://threadly.dev}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
