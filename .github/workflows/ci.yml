name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run supersedes an in-flight one for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle user home and reports build results on the run summary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers uses the Docker daemon preinstalled on GitHub runners.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          if-no-files-found: ignore
